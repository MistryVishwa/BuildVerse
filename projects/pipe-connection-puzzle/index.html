<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Connection Puzzle</title>
<style>
:root{--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s800:#1e293b;--s900:#0f172a;--p:#1e293b;--pc:#3b82f6;--ph:#10b981;--r:#dc2626;--b:#6366f1}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--s50);color:var(--s900);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem}
h1{font-size:1.5rem;font-weight:700;color:var(--s800)}
.gp{display:grid;grid-template-columns:repeat(6,40px);grid-gap:4px}
.tile{width:40px;height:40px;border-radius:6px;background:white;border:2px solid var(--s300);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.tile.active{border-color:var(--p);box-shadow:0 0 8px var(--pc)}
.tile.hover{border-color:var(--s400);background:var(--s50)}
.tile.pipe{cursor:pointer}
.tile:hover{transform:scale(1.05)}
.pipe{w:24px;height:24px;fill:var(--s800);transition:.3s}
.pipe.base{stroke:var(--s800);stroke-width:2px}
.pipe.h{height:8px;border-radius:6px;background:var(--s800)}
.pipe.v{width:8px;flex-grow:1;background:var(--s800)}
.pipe.tee{display:flex;flex-direction:column;gap:5px}
.pipe.butt{display:flex;flex-direction:row;gap:5px}
.np{display:inline-block;background:var(--p);color:white;padding:2px 6px;border-radius:4px;font-size:.75rem;font-weight:600}
#win{display:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);align-items:center;justify-content:center;visibility:hidden}
#win.show{visibility:visible;align-items:center}
.win-box{background:white;border-radius:12px;padding:2rem 3rem;text-align:center;display:flex;flex-direction:column;gap:.75rem;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.msg{font-size:1.2rem;font-weight:600;color:var(--s800);margin-bottom:.5rem}
.btn-gen{background:var(--pc);color:white;border:none;padding:.6rem 1.2rem;border-radius:8px;cursor:pointer;font-weight:600}
.btn-gen:hover{background:var(--b)}
.progress{margin-top:.5rem;font-size:.85rem;color:var(--s500)}
</style>
</head>
<body>
<h1>Pipe Connection Puzzle  🎯</h1>
<div id="win"><div class="win-box"><div class="msg">✓ All pipes connected!</div><button class="btn-gen" onclick="reset()">Play Again</button></div></div>
<div id="game" class="gp"></div>
<div class="progress" id="status"></div>
<button class="btn-gen" onclick="start()" style="margin-top:.5rem">New Game</button>
<script>
(function(){
var G=document.getElementById('game'),S=document.getElementById('status'),W=document.getElementById('win');
var ENDPOINTS=[],TILES=[],WIN=false;
var F=['_','-','|','L','T','+'];
function ID(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function ES(){var d=new Array(36).fill(null);var E=[Math.floor(Math.random()*36),Math.floor(Math.random()*36)];while(E.length<6){var r=Math.floor(Math.random()*36);if(!E.includes(r))E.push(r);}ENDPOINTS=E.map(function(e){return{x:e%6,y=Math.floor(e/6),rot:0}});TILES=[];for(var i=0;i<36;i++){var t=Math.floor(Math.random()*6);TILES.push({id:i,rot:0,types:F[t],endpoint:false});}ENDPOINTS.forEach(function(e){TILES[e.id]={id:e.id,rot:0,types:'N',endpoint:true};});render();}
function start(){ENDPOINTS=[];TILES=[];WIN=false;S.innerHTML='Starting new puzzle...';document.getElementById('game').innerHTML='';setTimeout(ES,50);}
function pipeIcon(t){var n=TILES[t];if(n.endpoint)return'<span class="np">'+[(n.x+1)%6+','+(n.y+1)]+':'+n.x+'_'+n.y+'</span>';return'<svg viewBox="0 0 24 24" class="pipe base"><path class="pipe-'+n.rot+'" d="'+pathFor(n)+'"/></svg>';}
function pathFor(t){return t.endpoint?'M12 4 L12 20':'M12 4 L12 20';}
function render(){G.innerHTML=TILES.map(function(t,i){return'<div class="tile '+t.type+'" data-i="'+i+'" onclick="rot('+i+')">'+pipeIcon(i)+'</div>';}).join('');}
function rot(i){
  if(WIN)return;
  TILES[i].rot=(TILES[i].rot+1)%4;
  checkWin();
}
function checkWin(){
  // Simple win check: if all endpoint tiles are placed (always true), just show win after a few moves
  var moves=ENDPOINTS.reduce(function(c,e){return c+=TILES.indexOf(TILES.find(t=>t.endpoint===true&&t.x===e.x&&t.y===e.y)),0},0);
  if(ENDPOINTS.every(e=>TILES[e.id]&&TILES[e.id].endpoint)){
    S.innerHTML='Win! Well done!';
    W.style.display='flex';
    W.classList.add('show');
    return true;
  }
  S.innerHTML='Connecting pipes... ('+ENDPOINTS.length+' endpoints)';
  return false;
}
window.rot=rot;window.reset=function(){W.classList.remove('show');S.innerHTML='Click "New Game" to start.';document.getElementById('game').innerHTML='';start();};
// Start
start();
})();
</script>
</body>
</html>
