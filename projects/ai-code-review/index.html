<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Code Review Assistant — BuildVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0f1216; --panel: #181c22; --panel-line: #2a2f37; --paper: #ece5d8; --paper-dim: #cfc6b6; --safelight: #d5432b; --safelight-light: #ee7a5c; --ok: #79946f; --warn: #e0a458; --bad: #d5432b; --info: #5ba9f0; --radius: 6px; --muted: #8a877e; --font-display: "IBM Plex Mono", monospace; --font-body: "IBM Plex Sans", sans-serif; }
[data-theme="light"] { --bg: #f3f1ec; --panel: #ffffff; --panel-line: #d8d3c8; --paper: #1c1714; --paper-dim: #4a4239; --muted: #7a756c; --safelight: #b73a23; --safelight-light: #d5432b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: radial-gradient(circle at 15% -10%, #1a1f25 0%, transparent 55%), var(--bg); color: var(--paper); font-family: var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100vh; padding-bottom: 40px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 60px; }
.masthead { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
.masthead__mark { display: flex; align-items: center; gap: 10px; }
.masthead__dot { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--safelight-light), var(--safelight) 70%); box-shadow: 0 0 8px rgba(213,67,43,0.6); }
.masthead__title { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.masthead__sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.theme-toggle { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--panel-line); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.15s ease; }
.theme-toggle:hover { color: var(--paper); border-color: var(--safelight); }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 22px; margin-bottom: 18px; }
.panel__title { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--safelight-light); margin: 0 0 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.02em; }
.field textarea { width: 100%; background: #0a0d10; border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 12px 14px; color: var(--paper); font-family: var(--font-display); font-size: 12.5px; line-height: 1.5; tab-size: 2; }
[data-theme="light"] .field textarea { background: #f9f6ef; color: var(--paper); }
.field textarea:focus { outline: none; border-color: var(--safelight); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.btn { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--safelight); border: 1px solid var(--safelight); color: #fff3ef; padding: 11px 18px; border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; }
.btn:hover { filter: brightness(1.1); }
.btn--ghost { background: transparent; color: var(--paper-dim); border-color: var(--panel-line); }
.btn--ghost:hover { border-color: var(--safelight); color: var(--paper); }
.verdict-row { padding: 12px 14px; border: 1px solid var(--panel-line); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel); }
.verdict-row--high { border-color: var(--bad); background: rgba(213,67,43,0.06); }
.verdict-row--medium { border-color: var(--warn); background: rgba(224,164,88,0.06); }
.verdict-row--info { border-color: var(--info); background: rgba(91,169,240,0.06); }
.verdict-row__title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.verdict-row__title ._badge { padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid currentColor; }
.verdict-row__loc { color: var(--muted); font-size: 11.5px; font-family: var(--font-display); letter-spacing: 0.04em; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.verdict-row__loc code { color: var(--safelight-light); }
.verdict-row__msg { color: var(--paper-dim); font-size: 12.5px; margin-top: 6px; }
.flash { position: fixed; bottom: 24px; right: 24px; background: var(--safelight); color: #fff3ef; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 999; transition: opacity 0.3s; opacity: 0; pointer-events: none; font-family: var(--font-display); letter-spacing: 0.06em; }
.flash.is-visible { opacity: 1; }
@media (max-width: 700px) { .theme-toggle { position: static; margin-bottom: 16px; } }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button">🌙 Light</button>
<div class="wrap">
  <header class="masthead">
    <div class="masthead__mark"><span class="masthead__dot" aria-hidden="true"></span><span class="masthead__title">AI Code Review Assistant</span></div>
    <p class="masthead__sub">Paste code and get instant heuristic analysis — bugs, security, suggestions, style fixes.</p>
  </header>
  <div class="panel">
    <h2 class="panel__title">Code input</h2>
    <div class="field">
      <label for="codeInput">Paste your code block</label>
      <textarea id="codeInput" rows="14" placeholder="function find(arr, target) { return target > arr.length ? 'text' : 0 }"></textarea>
    </div>
    <div class="btn-row"><button class="btn" id="reviewBtn" type="button">✓ Review code</button><button class="btn btn--ghost" id="clearBtn" type="button">✕ Clear</button></div>
  </div>
  <div class="panel">
    <h2 class="panel__title">AI Feedback</h2>
    <div id="feedbackList"></div>
  </div>
</div>
<div class="flash" id="flash" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  var STORE_TH = 'crv:theme';
  function loadTheme() { try { return localStorage.getItem(STORE_TH) || 'dark'; } catch (e) { return 'dark'; } }
  function saveTheme(t) { try { localStorage.setItem(STORE_TH, t); } catch (e) {} }
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); themeToggle.textContent = t === 'dark' ? '🌙 Light' : '☀ Dark'; }
  applyTheme(loadTheme());
  themeToggle.addEventListener('click', function () { var cur = document.documentElement.getAttribute('data-theme') || 'dark'; var next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); saveTheme(next); });
  var flash = document.getElementById('flash'); var flashTimer = null;
  function toast(msg) { flash.textContent = msg; flash.classList.add('is-visible'); clearTimeout(flashTimer); flashTimer = setTimeout(function () { flash.classList.remove('is-visible'); }, 3000); }

  // Heuristic offset-based blame: scan code for known patterns.
  function review(code) {
    var issues = [];
    var lines = code.split(/\r?\n/);

    // Security — hashing.
    if (/md5\(/.test(code) || /sha1\(/.test(code)) issues.push({ line: 0, severity: 'medium', title: 'Weak hash function', msg: 'Replace md5/sha1 with sha256 or bcrypt for cryptographically secure contexts.' });

    // Security — innerHTML.
    if (/innerHTML\s*=/.test(code)) issues.push({ line: 0, severity: 'high', title: 'Potential XSS vector (innerHTML assignment)', msg: 'innerHTML= opens a DOM-XSS risk when assigned from an untrusted source. Prefer textContent or a sanitised directive for vanilla JS.' });

    // Bug — return mismatch.
    if (/return\s+/.test(code) && /if\s/.test(code) && /\.length/.test(code)) issues.push({ line: 0, severity: 'medium', title: 'Mixed return type', msg: 'A function returns multiple types (e.g. string orb number). Add explicit input validation or typed prefix.' });

    // Suggestion — var → const/let.
    var varCount = 0; lines.forEach(function (l) { if (/\bvar\s+.+=/.test(l)) varCount++; });
    if (varCount >= 1) issues.push({ line: 0, severity: 'info', title: 'Prefer const / let over var', msg: varCount + ' var declarations found — prefer const for scope-bound, mutable — let.' });

    // Suggestion — console.log in prod.
    var logCount = lines.filter(function (l) { return /\bconsole\.log\(/.test(l); }).length;
    if (logCount >= 3) issues.push({ line: 0, severity: 'info', title: '⚠ Debug logging in production', msg: 'Detected ' + logCount + ' console.log statements; remove or guard them with dev flag.' });

    // Security — password in source.
    // Simple pass pattern: password = "..."
    if (/password[=:]\s*"[a-zA-Z0-9]"/g.test(code)) issues.push({ line: 0, severity: 'high', title: 'Hardcoded password', msg: 'Found password string literal — move to environment variable or vault.' });

    return issues;
  }

  function reviewCode(text) {
    var issues = review(text);
    var slot = document.getElementById('feedbackList');
    if (issues.length === 0) {
      slot.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--ok); font-weight: 700;">No obvious issues detected — looks clean!</div>';
      return;
    }
    slot.innerHTML = issues.map(function (is) {
      var level = is.severity === 'high' ? 'high' : is.severity === 'medium' ? 'medium' : 'info';
      var badge = is.severity === 'high' ? 'BUG' : is.severity === 'medium' ? 'WARN' : 'INFO';
      return '' +
        '<div class="verdict-row verdict-row--' + level + '">' +
        '  <div class="verdict-row__title"><span style="padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid currentColor;">' + badge + '</span> ' + escapeHtml(is.title) + '</div>' +
        '  <div class="verdict-row__msg">' + escapeHtml(is.detail || is.msg || '') + '</div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('reviewBtn').addEventListener('click', function () {
    var code = (document.getElementById('codeInput').value || '').trim();
    if (!code) { toast('Paste a code block first'); return; }
    reviewCode(code);
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    document.getElementById('codeInput').value = '';
    document.getElementById('feedbackList').innerHTML = '';
  });

  function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>""]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
})();
</script>
</body>
</html>
